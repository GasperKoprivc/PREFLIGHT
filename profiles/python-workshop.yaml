schema_version: 1
id: python-workshop
name: "Python delavnica"
checks:
  - id: python
    type: runtime
    tool: python
    version: ">=3.11.0"
    required: true
  - id: git
    type: runtime
    tool: git
    version: ">=2.40.0"
    required: true
  - id: node
    type: runtime
    tool: node
    version: ">=22.0.0,<23.0.0"
    required: false
  - id: vscode-python
    type: vscode_extension
    extension: ms-python.python
    required: true
  - id: disk
    type: disk_space
    min_free_gb: 5
    required: true
  - id: pypi
    type: https
    url: https://pypi.org
    required: false
