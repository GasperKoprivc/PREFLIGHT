[workspace]
resolver = "2"
members = ["crates/preflight-core", "crates/preflight-cli", "apps/server", "apps/desktop/src-tauri"]
[workspace.package]
version = "0.1.0"
edition = "2021"
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
preflight-core = { path = "crates/preflight-core" }
