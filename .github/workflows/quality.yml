name: Quality checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run lint --workspaces
      - run: npm run test --workspaces --if-present
      - run: npm run build --workspaces
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: API integration tests with real SQLite migrations
        run: cargo test -p preflight-server --test api --locked
      - name: Real HTTP smoke test (isolated in-memory database)
        run: npm run smoke:api
      - name: Node advisory audit
        if: runner.os == 'Linux'
        run: npm audit --audit-level=high
      - name: Rust advisory audit
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-audit --version 0.23.0 --locked
          cargo audit
